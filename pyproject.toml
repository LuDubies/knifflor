[project]
name = "knifflor"
version = "0.1.0"
description = "Kniffel-Notizen implementiert für Frau leicht ohne Rechnen."
requires-python = ">=3.11"
dependencies = ["flask>=3.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
